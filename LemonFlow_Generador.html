<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LemonFlow — Generador de Propuestas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#0f0720;min-height:100vh;color:#1a0a2e;}
.topbar{background:linear-gradient(90deg,#8B2FC9,#C13584);height:4px;}
.navbar{background:#0f0720;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(139,47,201,0.3);}
.navbar-left{display:flex;align-items:center;gap:8px;}
.logo-lemon{color:#C77DFF;font-size:20px;font-weight:600;}
.logo-flow{color:#fff;font-size:20px;font-weight:600;}
.logo-by{color:#9B72CF;font-size:11px;margin-left:4px;}
.btn-repo{background:rgba(139,47,201,0.15);border:1px solid rgba(139,47,201,0.4);color:#C77DFF;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-repo:hover{background:rgba(139,47,201,0.3);}
.main{display:grid;grid-template-columns:460px 1fr;min-height:calc(100vh - 56px);}
.panel{background:#160a28;border-right:1px solid rgba(139,47,201,0.25);padding:28px 24px 40px;overflow-y:auto;}
.panel-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#C77DFF;margin-bottom:20px;}
.section-block{margin-bottom:20px;}
.section-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8B2FC9;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid rgba(139,47,201,0.2);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.field-row.full{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:4px;}
label{font-size:10.5px;color:#9B72CF;font-weight:500;}
input,select,textarea{background:rgba(255,255,255,0.04);border:1px solid rgba(139,47,201,0.3);border-radius:7px;padding:7px 10px;font-size:12px;font-family:'DM Sans',sans-serif;color:#e0c8ff;outline:none;transition:border-color .2s;width:100%;}
textarea{resize:vertical;min-height:70px;}
input:focus,select:focus,textarea:focus{border-color:#8B2FC9;background:rgba(139,47,201,0.08);}
input::placeholder,textarea::placeholder{color:rgba(155,114,207,0.35);}
select option{background:#1a0a2e;color:#e0c8ff;}
.roles-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.opt-block{background:rgba(139,47,201,0.06);border:1px solid rgba(139,47,201,0.2);border-radius:10px;padding:12px;margin-bottom:10px;}
.opt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.opt-label{font-size:11px;font-weight:600;color:#C77DFF;}
.opt-toggle{display:flex;align-items:center;gap:8px;}
.toggle{position:relative;width:36px;height:20px;cursor:pointer;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:rgba(139,47,201,0.2);border-radius:20px;transition:.3s;border:1px solid rgba(139,47,201,0.3);}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;background:#9B72CF;border-radius:50%;left:2px;top:2px;transition:.3s;}
.toggle input:checked+.toggle-slider{background:#6B21C8;}
.toggle input:checked+.toggle-slider:before{transform:translateX(16px);background:#fff;}
.toggle-lbl{font-size:11px;color:#9B72CF;}
.opt-content{display:none;}
.opt-content.visible{display:block;}
.prod-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
.btn-gen{width:100%;margin-top:20px;padding:12px;background:linear-gradient(135deg,#6B21C8,#8B2FC9);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;}
.btn-gen:hover{opacity:.9;}
.action-btns{display:flex;gap:8px;margin-top:10px;}
.btn-save{flex:1;padding:10px;background:rgba(139,47,201,0.15);border:1px solid rgba(139,47,201,0.4);color:#C77DFF;border-radius:8px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;}
.btn-save:hover{background:rgba(139,47,201,0.3);}
/* PREVIEW */
.preview-area{background:#f0eafa;display:flex;flex-direction:column;align-items:center;padding:32px 24px;overflow-y:auto;}
.preview-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B21C8;margin-bottom:20px;align-self:flex-start;}
.propuesta{background:#fff;width:100%;max-width:700px;border-radius:12px;overflow:hidden;box-shadow:0 8px 40px rgba(107,33,200,.15);}
.prop-header{background:#0f0720;}
.prop-topbar{background:linear-gradient(90deg,#8B2FC9,#C13584);height:5px;}
.prop-header-inner{padding:18px 22px 12px;display:flex;justify-content:space-between;align-items:flex-start;background:#0f0720;}
.prop-logo-lemon{color:#C77DFF;font-size:20px;font-weight:700;}
.prop-logo-flow{color:#fff;font-size:20px;font-weight:700;}
.prop-logo-by{color:#9B72CF;font-size:10px;display:block;margin-top:2px;}
.prop-header-right{text-align:right;font-size:10px;color:#9B72CF;line-height:2;}
.prop-header-right .h{color:#e0c8ff;}
.prop-header-right .l{color:#C77DFF;}
.prop-subheader{background:#6B21C8;padding:8px 22px;display:flex;gap:0;}
.prop-meta{flex:1;font-size:9.5px;color:#e0c8ff;}
.prop-meta b{color:#fff;}
.prop-body{padding:18px 22px;background:#fff;}
.prop-section{margin-bottom:16px;}
.prop-sec-title{font-size:11px;font-weight:700;color:#6B21C8;border-left:3px solid #8B2FC9;padding-left:8px;margin-bottom:8px;}
.prop-fields{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.prop-field{background:#F8F5FF;border:0.5px solid #e5d5fa;border-radius:6px;padding:6px 10px;}
.prop-field .fl{font-size:8px;color:#9B72CF;margin-bottom:1px;}
.prop-field .fv{font-size:11px;font-weight:600;color:#1a0a2e;}
.prop-table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:4px;}
.prop-table thead tr{background:#f3e8ff;}
.prop-table thead th{text-align:left;padding:6px 8px;font-weight:700;color:#4c1d95;border-bottom:1px solid #d8b4fe;font-size:9px;}
.prop-table tbody td{padding:6px 8px;color:#1a0a2e;border-bottom:0.5px solid #ede9f6;font-size:9.5px;}
.prop-table tbody tr:nth-child(even) td{background:#faf7ff;}
.badge-gratis{background:#EAF3DE;color:#3B6D11;font-size:8px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-block;}
.prop-opt-block{background:#F8F5FF;border:0.5px solid #e5d5fa;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.prop-opt-title{font-size:9px;font-weight:700;color:#6B21C8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;}
.prop-total-box{background:#0f0720;color:#e0c8ff;font-size:10px;font-weight:700;padding:6px 14px;border-radius:6px;display:inline-block;margin-top:4px;}
.prop-desc{background:#F8F5FF;border:0.5px solid #e5d5fa;border-radius:6px;padding:8px 12px;font-size:10px;color:#4c1d95;margin-bottom:6px;line-height:1.6;}
.prop-desc-lbl{font-size:8px;color:#9B72CF;font-weight:600;display:block;margin-bottom:3px;}
.prop-cond{background:#f3e8ff;border-left:3px solid #8B2FC9;border:0.5px solid #d8b4fe;border-radius:6px;padding:8px 12px;font-size:10px;font-weight:600;color:#4c1d95;}
.prop-minuta{background:#F8F5FF;border:0.5px solid #e5d5fa;border-radius:6px;padding:10px 12px;font-size:10px;color:#333;line-height:1.7;white-space:pre-wrap;}
.prop-legal-row{display:flex;gap:10px;padding:6px 10px;border-bottom:0.5px solid #ede9f6;font-size:9px;}
.prop-legal-row:nth-child(odd){background:#F8F5FF;}
.prop-legal-num{color:#6B21C8;font-weight:700;min-width:16px;}
.prop-legal-ttl{font-weight:700;color:#1a0a2e;}
.prop-legal-desc{color:#6b7280;margin-top:1px;}
.prop-legal-desc a{color:#6B21C8;text-decoration:underline;}
.prop-footer{border-top:1px solid #ede9f6;padding:20px 22px 16px;display:flex;justify-content:space-between;align-items:flex-end;}
.prop-footer-left{font-size:9px;color:#9B72CF;}
.firma-area{text-align:center;}
.firma-line{border-top:1.5px solid #4c1d95;width:220px;margin:0 auto 6px;}
.firma-text{font-size:9px;color:#4c1d95;font-weight:600;}
.firma-sub{font-size:8px;color:#9B72CF;margin-top:2px;}
.btn-dl{margin-top:16px;padding:11px 28px;background:#0f0720;color:#C77DFF;border:1px solid rgba(139,47,201,0.5);border-radius:8px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;}
.btn-dl:hover{background:#1a0a2e;}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#160a28;border:1px solid rgba(139,47,201,0.4);border-radius:14px;width:560px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-header{padding:18px 24px 12px;border-bottom:1px solid rgba(139,47,201,0.2);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:14px;font-weight:600;color:#C77DFF;}
.modal-close{background:none;border:none;color:#9B72CF;font-size:20px;cursor:pointer;}
.modal-body{padding:16px 24px;overflow-y:auto;flex:1;}
.repo-empty{text-align:center;color:#9B72CF;font-size:13px;padding:32px 0;}
.repo-item{background:rgba(139,47,201,0.08);border:1px solid rgba(139,47,201,0.2);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.repo-item-info{flex:1;min-width:0;}
.repo-item-name{font-size:13px;font-weight:600;color:#e0c8ff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.repo-item-meta{font-size:10.5px;color:#9B72CF;}
.repo-item-btns{display:flex;gap:6px;flex-shrink:0;}
.btn-load{background:#6B21C8;border:none;color:#fff;padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-load:hover{background:#8B2FC9;}
.btn-del{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.toast{position:fixed;bottom:24px;right:24px;background:#6B21C8;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;z-index:2000;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="topbar"></div>
<nav class="navbar">
  <div class="navbar-left">
    <span class="logo-lemon">Lemon</span><span class="logo-flow">Flow</span>
    <span class="logo-by">by LemonTech</span>
  </div>
  <button class="btn-repo" onclick="openRepo()">📁 Mis propuestas</button>
</nav>

<div class="main">
<aside class="panel">
  <div class="panel-title">Generador de propuesta</div>

  <!-- AM -->
  <div class="section-block">
    <div class="section-label">Account Manager</div>
    <div class="field-row">
      <div class="field"><label>Nombre</label><input id="am_nombre" placeholder="Tu nombre" oninput="update()"/></div>
      <div class="field"><label>Correo</label><input id="am_correo" placeholder="tu@lemontech.com" oninput="update()"/></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Fecha de emisión</label><input id="am_emision" type="date" oninput="update()"/></div>
      <div class="field"><label>Fecha de vencimiento</label><input id="am_vencimiento" type="date" oninput="update()"/></div>
    </div>
  </div>

  <!-- CLIENTE -->
  <div class="section-block">
    <div class="section-label">Información del cliente</div>
    <div class="field-row">
      <div class="field"><label>Nombre de contacto</label><input id="cl_nombre" placeholder="Nombre" oninput="update()"/></div>
      <div class="field"><label>Correo</label><input id="cl_correo" placeholder="correo@cliente.com" oninput="update()"/></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Razón social</label><input id="cl_razon" placeholder="Empresa" oninput="update()"/></div>
      <div class="field"><label>RUT / Tax ID</label><input id="cl_tax" placeholder="ej. 76.123.456-7" oninput="update()"/></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Giro / Actividad</label><input id="cl_giro" placeholder="ej. Jurídico" oninput="update()"/></div>
      <div class="field"><label>Modalidad de facturación</label>
        <select id="cl_modal" onchange="update()">
          <option value="Anual">Anual</option>
          <option value="Semestral">Semestral</option>
          <option value="Trimestral">Trimestral</option>
          <option value="Mensual">Mensual</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Inicio suscripción</label><input id="cl_inicio" placeholder="ej. Mayo 2026" oninput="update()"/></div>
      <div class="field"><label>Fin suscripción</label><input id="cl_fin" placeholder="ej. Abril 2027" oninput="update()"/></div>
    </div>
  </div>

  <!-- OPCIONES DE COTIZACIÓN -->
  <div class="section-block">
    <div class="section-label">Cotizaciones (hasta 4 opciones)</div>

    <!-- Opción 1 (siempre visible) -->
    <div class="opt-block">
      <div class="opt-header"><span class="opt-label">✦ Opción 1</span>
        <div class="field-row" style="margin:0;gap:8px;">
          <div class="field"><label>Moneda</label>
            <select id="pr_moneda" onchange="update()">
              <option value="USD">USD</option><option value="CLP">CLP</option>
              <option value="UF">UF</option><option value="EUR">EUR</option>
              <option value="MXN">MXN</option><option value="COP">COP</option><option value="PEN">PEN</option>
            </select>
          </div>
        </div>
      </div>
      <div class="prod-row">
        <div class="field"><label>Producto</label><input id="o1_prod" placeholder="ej. LemonFlow" oninput="update()"/></div>
        <div class="field"><label>Valor mensual</label><input id="o1_valor" placeholder="0" oninput="update()"/></div>
        <div class="field"><label>Implementación</label><input id="o1_impl" placeholder="ej. Gratis" oninput="update()"/></div>
        <div class="field"><label>Vencimiento</label><input id="o1_venc" type="date" oninput="update()"/></div>
      </div>
      <div class="section-label" style="margin-top:8px;">Usuarios por rol</div>
      <div class="roles-grid">
        <div class="field"><label>Super Administrador</label><input id="o1_r1" type="number" min="0" placeholder="0" oninput="update()"/></div>
        <div class="field"><label>Administrador</label><input id="o1_r2" type="number" min="0" placeholder="0" oninput="update()"/></div>
        <div class="field"><label>Contribuyente</label><input id="o1_r3" type="number" min="0" placeholder="0" oninput="update()"/></div>
        <div class="field"><label>DPO</label><input id="o1_r4" type="number" min="0" placeholder="0" oninput="update()"/></div>
        <div class="field"><label>Razones sociales</label><input id="o1_r5" type="number" min="0" placeholder="0" oninput="update()"/></div>
      </div>
    </div>

    <!-- Opción 2 -->
    <div class="opt-block">
      <div class="opt-header">
        <span class="opt-label">✦ Opción 2</span>
        <div class="opt-toggle">
          <label class="toggle"><input type="checkbox" id="tog2" onchange="toggleOpt(2)"/><span class="toggle-slider"></span></label>
          <span class="toggle-lbl">Activar</span>
        </div>
      </div>
      <div class="opt-content" id="opt2">
        <div class="prod-row">
          <div class="field"><label>Producto</label><input id="o2_prod" placeholder="ej. LemonFlow" oninput="update()"/></div>
          <div class="field"><label>Valor mensual</label><input id="o2_valor" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Implementación</label><input id="o2_impl" placeholder="ej. Gratis" oninput="update()"/></div>
          <div class="field"><label>Vencimiento</label><input id="o2_venc" type="date" oninput="update()"/></div>
        </div>
        <div class="roles-grid">
          <div class="field"><label>Super Administrador</label><input id="o2_r1" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Administrador</label><input id="o2_r2" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Contribuyente</label><input id="o2_r3" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>DPO</label><input id="o2_r4" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Razones sociales</label><input id="o2_r5" type="number" min="0" placeholder="0" oninput="update()"/></div>
        </div>
      </div>
    </div>

    <!-- Opción 3 -->
    <div class="opt-block">
      <div class="opt-header">
        <span class="opt-label">✦ Opción 3</span>
        <div class="opt-toggle">
          <label class="toggle"><input type="checkbox" id="tog3" onchange="toggleOpt(3)"/><span class="toggle-slider"></span></label>
          <span class="toggle-lbl">Activar</span>
        </div>
      </div>
      <div class="opt-content" id="opt3">
        <div class="prod-row">
          <div class="field"><label>Producto</label><input id="o3_prod" placeholder="ej. LemonFlow" oninput="update()"/></div>
          <div class="field"><label>Valor mensual</label><input id="o3_valor" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Implementación</label><input id="o3_impl" placeholder="ej. Gratis" oninput="update()"/></div>
          <div class="field"><label>Vencimiento</label><input id="o3_venc" type="date" oninput="update()"/></div>
        </div>
        <div class="roles-grid">
          <div class="field"><label>Super Administrador</label><input id="o3_r1" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Administrador</label><input id="o3_r2" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Contribuyente</label><input id="o3_r3" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>DPO</label><input id="o3_r4" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Razones sociales</label><input id="o3_r5" type="number" min="0" placeholder="0" oninput="update()"/></div>
        </div>
      </div>
    </div>

    <!-- Opción 4 -->
    <div class="opt-block">
      <div class="opt-header">
        <span class="opt-label">✦ Opción 4</span>
        <div class="opt-toggle">
          <label class="toggle"><input type="checkbox" id="tog4" onchange="toggleOpt(4)"/><span class="toggle-slider"></span></label>
          <span class="toggle-lbl">Activar</span>
        </div>
      </div>
      <div class="opt-content" id="opt4">
        <div class="prod-row">
          <div class="field"><label>Producto</label><input id="o4_prod" placeholder="ej. LemonFlow" oninput="update()"/></div>
          <div class="field"><label>Valor mensual</label><input id="o4_valor" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Implementación</label><input id="o4_impl" placeholder="ej. Gratis" oninput="update()"/></div>
          <div class="field"><label>Vencimiento</label><input id="o4_venc" type="date" oninput="update()"/></div>
        </div>
        <div class="roles-grid">
          <div class="field"><label>Super Administrador</label><input id="o4_r1" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Administrador</label><input id="o4_r2" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Contribuyente</label><input id="o4_r3" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>DPO</label><input id="o4_r4" type="number" min="0" placeholder="0" oninput="update()"/></div>
          <div class="field"><label>Razones sociales</label><input id="o4_r5" type="number" min="0" placeholder="0" oninput="update()"/></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONDICIÓN Y MINUTA -->
  <div class="section-block">
    <div class="section-label">Condición particular</div>
    <div class="field-row full">
      <div class="field"><label>Detalle</label><input id="cond_det" placeholder="Describe la condición especial" oninput="update()"/></div>
    </div>
  </div>

  <div class="section-block">
    <div class="section-label">Minuta de reunión</div>
    <div class="field-row full">
      <div class="field"><label>Resumen de la reunión</label>
        <textarea id="minuta" placeholder="Escribe aquí los puntos tratados en la reunión, acuerdos, próximos pasos..." oninput="update()"></textarea>
      </div>
    </div>
  </div>

  <button class="btn-gen" onclick="update()">↻ Actualizar vista previa</button>
  <div class="action-btns">
    <button class="btn-save" onclick="saveProposal()">💾 Guardar propuesta</button>
  </div>
</aside>

<section class="preview-area">
  <div class="preview-title">Vista previa de la propuesta</div>
  <div class="propuesta" id="propuesta"></div>
  <button class="btn-dl" onclick="downloadPDF()">⬇ Descargar PDF</button>
</section>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-repo" onclick="if(event.target===this)closeRepo()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">📁 Mis propuestas guardadas</span>
      <button class="modal-close" onclick="closeRepo()">✕</button>
    </div>
    <div class="modal-body" id="repo-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const WORKER_URL='https://propuestas-lemontech.vzapata.workers.dev';
const STORAGE_KEY='lemonflow_proposals';

function v(id){return(document.getElementById(id)||{}).value||'';}
function fmtDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');if(isNaN(d))return s;return d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});}
function getMultiplier(){
  const modal=v('cl_modal');
  if(modal==='Mensual') return 1;
  if(modal==='Trimestral') return 3;
  if(modal==='Semestral') return 6;
  return 12; // Anual por defecto
}
function getTotalLabel(){
  const modal=v('cl_modal');
  if(modal==='Mensual') return 'Total mensual';
  if(modal==='Trimestral') return 'Total trimestral';
  if(modal==='Semestral') return 'Total semestral';
  return 'Total anual';
}
function fmtNum(n){return((parseFloat(n)||0)*getMultiplier()).toLocaleString('es-CL');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

function toggleOpt(n){
  document.getElementById('opt'+n).classList.toggle('visible', document.getElementById('tog'+n).checked);
  update();
}

function getOpts(){
  const opts=[];
  for(let i=1;i<=4;i++){
    if(i===1||document.getElementById('tog'+i)?.checked){
      const roles=[
        ['Super Administrador',v('o'+i+'_r1')],
        ['Administrador',v('o'+i+'_r2')],
        ['Contribuyente',v('o'+i+'_r3')],
        ['DPO',v('o'+i+'_r4')],
        ['Razones sociales',v('o'+i+'_r5')],
      ].filter(r=>r[1]&&r[1]!=='0');
      opts.push({
        num:i, prod:v('o'+i+'_prod'), valor:v('o'+i+'_valor'),
        impl:v('o'+i+'_impl'), venc:v('o'+i+'_venc'), roles
      });
    }
  }
  return opts;
}

function rolesInline(roles){
  if(!roles.length) return '';
  return '<div style="font-size:8.5px;color:#4c1d95;margin-top:5px;padding:4px 6px;background:#f3e8ff;border-radius:4px;">'+
    roles.map(r=>'<span style="margin-right:8px;"><b>'+r[0]+':</b> '+r[1]+'</span>').join('')+
    '</div>';
}

function update(){
  const mon=v('pr_moneda');
  const opts=getOpts();
  const minuta=v('minuta');

  const optsHtml=opts.map(o=>`
    <div class="prop-opt-block">
      <div class="prop-opt-title">Propuesta ${o.num} — ${o.prod||'—'}</div>
      <table class="prop-table">
        <thead><tr><th>Producto</th><th>Valor mensual</th><th>Implementación</th><th>Vencimiento</th><th style="text-align:right;">Total anual</th></tr></thead>
        <tbody><tr>
          <td>${o.prod||'—'}</td>
          <td>${o.valor||'0'} ${mon}</td>
          <td><span class="badge-gratis">${o.impl||'—'}</span></td>
          <td>${fmtDate(o.venc)}</td>
          <td style="text-align:right;font-weight:700;color:#6B21C8;">${fmtNum(o.valor)} ${mon}</td>
        </tr></tbody>
      </table>
      ${rolesInline(o.roles)}
    </div>`).join('');

  // Propuestas en pares (1+2 lado a lado, 3+4 lado a lado)
  const pairsHtml=()=>{
    let html='';
    for(let i=0;i<opts.length;i+=2){
      const a=opts[i]; const b=opts[i+1];
      html+=`<div style="display:grid;grid-template-columns:${b?'1fr 1fr':'1fr'};gap:8px;margin-bottom:8px;">
        <div class="prop-opt-block">
          <div class="prop-opt-title">Propuesta ${a.num} — ${a.prod||'—'}</div>
          <table class="prop-table"><thead><tr><th>Producto</th><th>Valor mensual</th><th>Implementación</th></tr></thead>
          <tbody><tr><td>${a.prod||'—'}</td><td>${a.valor||'0'} ${mon}</td><td><span class="badge-gratis">${a.impl||'—'}</span></td></tr></tbody></table>
          ${rolesInline(a.roles)}
          <div style="text-align:right;margin-top:6px;"><span class="prop-total-box" style="font-size:8px;padding:3px 10px;border-radius:20px;font-weight:700;">${getTotalLabel()}: ${fmtNum(a.valor)} ${mon}</span></div>
        </div>
        ${b?`<div class="prop-opt-block">
          <div class="prop-opt-title">Propuesta ${b.num} — ${b.prod||'—'}</div>
          <table class="prop-table"><thead><tr><th>Producto</th><th>Valor mensual</th><th>Implementación</th></tr></thead>
          <tbody><tr><td>${b.prod||'—'}</td><td>${b.valor||'0'} ${mon}</td><td><span class="badge-gratis">${b.impl||'—'}</span></td></tr></tbody></table>
          ${rolesInline(b.roles)}
          <div style="text-align:right;margin-top:6px;"><span class="prop-total-box" style="font-size:8px;padding:3px 10px;border-radius:20px;font-weight:700;">${getTotalLabel()}: ${fmtNum(b.valor)} ${mon}</span></div>
        </div>`:''}
      </div>`;
    }
    return html;
  };

  document.getElementById('propuesta').innerHTML=`
  <div class="prop-header">
    <div class="prop-topbar"></div>
    <div class="prop-header-inner">
      <div><div><span class="prop-logo-lemon">Lemon</span><span class="prop-logo-flow">Flow</span></div><span class="prop-logo-by">by LemonTech</span></div>
      <div class="prop-header-right"><div class="h">Lemontech SpA · Tax ID 99.511.620-0</div><div>Las Condes, Santiago. Chile.</div><div class="l">www.lemontech.com</div></div>
    </div>
    <div class="prop-subheader">
      <div class="prop-meta"><b>Account Manager</b> ${v('am_nombre')||'—'}</div>
      <div class="prop-meta"><b>Correo</b> ${v('am_correo')||'—'}</div>
      <div class="prop-meta"><b>Emisión</b> ${fmtDate(v('am_emision'))}</div>
      <div class="prop-meta"><b>Vence</b> ${fmtDate(v('am_vencimiento'))}</div>
    </div>
  </div>
  <div class="prop-body">
    <div class="prop-section">
      <div class="prop-sec-title">Información del cliente</div>
      <div class="prop-fields">
        <div class="prop-field"><div class="fl">Nombre de contacto</div><div class="fv">${v('cl_nombre')||'—'}</div></div>
        <div class="prop-field"><div class="fl">Correo</div><div class="fv">${v('cl_correo')||'—'}</div></div>
        <div class="prop-field"><div class="fl">Razón social</div><div class="fv">${v('cl_razon')||'—'}</div></div>
        <div class="prop-field"><div class="fl">RUT / Tax ID</div><div class="fv">${v('cl_tax')||'—'}</div></div>
        <div class="prop-field"><div class="fl">Giro / Actividad</div><div class="fv">${v('cl_giro')||'—'}</div></div>
        <div class="prop-field"><div class="fl">Modalidad de facturación</div><div class="fv">${v('cl_modal')}</div></div>
        <div class="prop-field"><div class="fl">Inicio suscripción</div><div class="fv">${v('cl_inicio')||'—'}</div></div>
        <div class="prop-field"><div class="fl">Fin suscripción</div><div class="fv">${v('cl_fin')||'—'}</div></div>
      </div>
    </div>
    ${minuta?`<div class="prop-section"><div class="prop-sec-title">Minuta de reunión</div><div class="prop-minuta">${minuta}</div></div>`:''}
    <div class="prop-section">
      <div class="prop-sec-title">Cotizaciones</div>
      ${pairsHtml()}
    </div>
    ${v('cond_det')?`<div class="prop-section"><div class="prop-sec-title">Condiciones particulares</div><div class="prop-cond">${v('cond_det')}</div></div>`:''}
    <div class="prop-section">
      <div class="prop-sec-title">Condiciones legales</div>
      <div class="prop-legal-row"><div class="prop-legal-num">1.</div><div><div class="prop-legal-ttl">Aceptación de la propuesta</div><div class="prop-legal-desc">La suscripción mediante firma implica la aceptación del servicio y de los Términos y Condiciones.</div></div></div>
      <div class="prop-legal-row"><div class="prop-legal-num">2.</div><div><div class="prop-legal-ttl">Términos y condiciones</div><div class="prop-legal-desc"><a href="https://recursos.lemontech.com/hubfs/Archivos-legales/ACUERDO-MARCO-DE-SERVICIOS-DE-LEMONTECH.pdf" target="_blank">recursos.lemontech.com/hubfs/Archivos-legales/ACUERDO-MARCO-DE-SERVICIOS-DE-LEMONTECH.pdf</a></div></div></div>
      <div class="prop-legal-row"><div class="prop-legal-num">3.</div><div><div class="prop-legal-ttl">Aviso de privacidad</div><div class="prop-legal-desc"><a href="https://recursos.lemontech.com/hubfs/Archivos-legales/AVISO-DE-PRIVACIDAD-LEMONTECH-Clientes.pdf" target="_blank">recursos.lemontech.com/hubfs/Archivos-legales/AVISO-DE-PRIVACIDAD-LEMONTECH-Clientes.pdf</a></div></div></div>
    </div>
  </div>
  <div class="prop-footer">
    <div class="prop-footer-left">Lemontech SpA · Tax ID 99.511.620-0</div>
    <div class="firma-area">
      <div class="firma-line"></div>
      <div class="firma-text">Firma y nombre del representante</div>
    </div>
  </div>`;
}

// ── REPOSITORIO ──────────────────────────────────────────────────────────────
function getProposals(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}catch(e){return[];}}
function saveProposalsLocal(arr){localStorage.setItem(STORAGE_KEY,JSON.stringify(arr));}

function collectData(){
  const data={};
  const ids=['am_nombre','am_correo','am_emision','am_vencimiento',
    'cl_nombre','cl_correo','cl_razon','cl_tax','cl_dir','cl_inicio','cl_fin','cl_modal','cl_pagos',
    'pr_moneda','cond_det','minuta'];
  ids.forEach(id=>data[id]=v(id));
  for(let i=1;i<=4;i++){
    ['prod','valor','impl','venc','r1','r2','r3','r4','r5'].forEach(f=>data['o'+i+'_'+f]=v('o'+i+'_'+f));
    data['_tog'+i]=i===1?true:(document.getElementById('tog'+i)?.checked||false);
  }
  return data;
}

function loadData(data){
  Object.entries(data).forEach(([id,val])=>{
    if(id.startsWith('_'))return;
    const el=document.getElementById(id);
    if(el)el.value=val;
  });
  for(let i=2;i<=4;i++){
    const cb=document.getElementById('tog'+i);
    if(cb){cb.checked=!!data['_tog'+i];document.getElementById('opt'+i).classList.toggle('visible',!!data['_tog'+i]);}
  }
  update();
}

async function saveProposal(){
  const cliente=v('cl_razon')||v('cl_nombre');
  const am=v('am_nombre');
  if(!cliente){showToast('⚠ Ingresa el nombre del cliente');return;}
  if(!am){showToast('⚠ Ingresa tu nombre');return;}
  const data=collectData();
  const nombre=`${cliente} - LemonFlow`;
  data.nombre_propuesta=nombre;
  const date=new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
  const proposals=getProposals();
  proposals.unshift({id:Date.now(),name:nombre,date,data});
  saveProposalsLocal(proposals);
  showToast('💾 Guardando en la nube...');
  try{
    const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({'Nombre':nombre,'AE':am,'Cliente':cliente,'Fecha':date,'Producto':'LemonFlow','Datos':JSON.stringify(data)})});
    showToast(res.ok?`✓ "${nombre}" guardada en la nube`:'✓ Guardada localmente');
  }catch(e){showToast('✓ Guardada localmente (sin conexión)');}
}

function openRepo(){renderRepo();document.getElementById('modal-repo').classList.add('open');}
function closeRepo(){document.getElementById('modal-repo').classList.remove('open');}

async function renderRepo(){
  const list=document.getElementById('repo-list');
  const am=v('am_nombre');
  list.innerHTML='<div class="repo-empty">Cargando...</div>';
  if(am){
    try{
      const res=await fetch(`${WORKER_URL}?ae=${encodeURIComponent(am)}&producto=LemonFlow`);
      const json=await res.json();
      if(json.records?.length){
        list.innerHTML=json.records.map(r=>{
          const d=JSON.parse(r.fields.Datos||'{}');
          return `<div class="repo-item"><div class="repo-item-info"><div class="repo-item-name">${r.fields.Nombre||'—'}</div><div class="repo-item-meta">☁️ ${r.fields.Fecha||''}</div></div>
          <div class="repo-item-btns"><button class="btn-load" onclick='loadCloudProposal(${JSON.stringify(d).replace(/'/g,"&#39;")})'>Abrir</button>
          <button class="btn-del" onclick="deleteAirtable('${r.id}')">✕</button></div></div>`;
        }).join('');return;
      }
    }catch(e){}
  }
  const proposals=getProposals();
  list.innerHTML=proposals.length?proposals.map(p=>`<div class="repo-item"><div class="repo-item-info"><div class="repo-item-name">${p.name}</div><div class="repo-item-meta">📱 Local — ${p.date}</div></div>
  <div class="repo-item-btns"><button class="btn-load" onclick="loadProposal(${p.id})">Abrir</button><button class="btn-del" onclick="deleteProposal(${p.id})">✕</button></div></div>`).join(''):
  `<div class="repo-empty">${am?'No hay propuestas para <b>'+am+'</b>.':'Ingresa tu nombre primero.'}</div>`;
}

function loadCloudProposal(d){loadData(d);closeRepo();showToast('✓ Propuesta cargada desde la nube');}
function loadProposal(id){const p=getProposals().find(x=>x.id===id);if(p){loadData(p.data);closeRepo();showToast('✓ Propuesta cargada');}}
function deleteProposal(id){saveProposalsLocal(getProposals().filter(x=>x.id!==id));renderRepo();}
async function deleteAirtable(id){try{await fetch(`${WORKER_URL}?id=${id}`,{method:'DELETE'});renderRepo();showToast('✓ Eliminada');}catch(e){}}

// ── PDF ──────────────────────────────────────────────────────────────────────
function downloadPDF(){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=15,U=W-2*M;
  const mon=v('pr_moneda');
  const opts=getOpts();

  // HEADER — igual que versión que funcionaba
  doc.setFillColor(15,7,32);doc.rect(0,0,W,28,'F');
  doc.setFillColor(139,47,201);doc.rect(0,0,W,2,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(199,125,255);doc.text('Lemon',M,14);
  const lw=doc.getTextWidth('Lemon');doc.setTextColor(255,255,255);doc.text('Flow',M+lw,14);
  doc.setFontSize(8);doc.setTextColor(155,114,207);doc.text('by LemonTech',M,20);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(224,200,255);
  doc.text('Lemontech SpA  ·  Tax ID 99.511.620-0',W-M,12,{align:'right'});
  doc.text('Las Condes, Santiago. Chile.',W-M,18,{align:'right'});
  doc.setTextColor(199,125,255);doc.text('www.lemontech.com',W-M,24,{align:'right'});

  doc.setFillColor(107,33,200);doc.rect(0,28,W,9,'F');
  const metas=[['Account Manager',v('am_nombre')],['Correo',v('am_correo')],['Emisión',fmtDate(v('am_emision'))],['Vence',fmtDate(v('am_vencimiento'))]];
  const colW=U/4;
  metas.forEach(([lbl,val],i)=>{
    const x=M+i*colW;
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(199,125,255);doc.text(lbl,x,33.5);
    doc.setFont('helvetica','normal');doc.setTextColor(224,200,255);doc.text(val||'',x,37.5);
  });

  let y=44;
  const secTitle=(txt)=>{
    doc.setDrawColor(139,47,201);doc.setLineWidth(0.8);doc.line(M,y,M,y+5);
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(107,33,200);doc.text(txt,M+4,y+4);y+=9;
  };
  const fieldGrid=(pairs)=>{
    const hw=(U-3)/2;
    for(let i=0;i<pairs.length;i+=2){
      pairs.slice(i,i+2).forEach((p,j)=>{
        const x=M+j*(hw+3);
        doc.setFillColor(248,245,255);doc.setDrawColor(229,213,250);doc.setLineWidth(0.3);doc.roundedRect(x,y,hw,10,1.5,1.5,'FD');
        doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(155,114,207);doc.text(p[0],x+3,y+4);
        doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(26,10,46);doc.text(p[1]||'—',x+3,y+8.5);
      });
      y+=12;
    }
    y+=2;
  };

  // CLIENTE — 8 campos
  secTitle('Información del cliente');
  fieldGrid([
    ['Nombre de contacto',v('cl_nombre')],['Correo',v('cl_correo')],
    ['Razón social',v('cl_razon')],['RUT / Tax ID',v('cl_tax')],
    ['Giro / Actividad',v('cl_giro')],['Modalidad de facturación',v('cl_modal')],
    ['Inicio suscripción',v('cl_inicio')],['Fin suscripción',v('cl_fin')]
  ]);

  // MINUTA
  if(v('minuta')){
    secTitle('Minuta de reunión');
    const ml=doc.splitTextToSize(v('minuta'),U-6);
    const mh=Math.max(10,4+ml.length*4.5);
    doc.setFillColor(248,245,255);doc.setDrawColor(229,213,250);doc.setLineWidth(0.3);doc.rect(M,y,U,mh,'FD');
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(51,51,51);doc.text(ml,M+3,y+5);
    y+=mh+4;
  }

  // COTIZACIONES — estilo igual que versión que funcionaba
  secTitle('Cotizaciones');
  const halfW=(U-4)/2;

  opts.forEach((o,idx)=>{
    const xStart=idx%2===0?M:M+halfW+4;
    const width=opts.length===1?U:halfW;
    if(idx%2===0&&idx>0) y+=2; // pequeño espacio entre filas de pares

    // Roles
    const rolesStr=o.roles.length?o.roles.map(r=>r[0].replace('Super Administrador','S.Adm').replace('Administrador','Adm').replace('Contribuyente','Contrib').replace('Razones sociales','R.Soc')+': '+r[1]).join('   '):'';
    const rl=rolesStr?doc.splitTextToSize(rolesStr,width-6):[];

    // Calcular altura total del bloque
    const rolesH=rl.length?3+rl.length*4.5:0;
    const blockH=8+7+8+rolesH+10;

    // Si es impar y hay siguiente, dibuja ambos a la misma altura
    const startY=(idx%2===1&&opts[idx-1])?y-blockH-2:y;

    // Fondo lila redondeado
    doc.setFillColor(248,245,255);doc.setDrawColor(229,213,250);doc.setLineWidth(0.4);
    doc.roundedRect(xStart,startY,width,blockH,2,2,'FD');
    let py=startY+2;

    // Título
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(107,33,200);
    doc.text('PROPUESTA '+o.num+(o.prod?' — '+o.prod:''),xStart+3,py+4);py+=7;

    // Cabecera tabla — fondo lila más oscuro con bordes
    doc.setFillColor(216,195,248);doc.rect(xStart,py,width,6,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(76,29,149);
    doc.text('Producto',xStart+3,py+4.5);
    doc.text('Valor mensual',xStart+width*0.42,py+4.5);
    doc.text('Implementación',xStart+width*0.68,py+4.5);
    py+=6;

    // Línea separadora
    doc.setDrawColor(216,195,248);doc.setLineWidth(0.3);doc.line(xStart,py,xStart+width,py);

    // Fila datos
    doc.setFillColor(255,255,255);doc.rect(xStart,py,width,7,'F');
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(26,10,46);
    doc.text(o.prod||'—',xStart+3,py+5);
    doc.text(o.valor+' '+mon,xStart+width*0.42,py+5);
    doc.text(o.impl||'—',xStart+width*0.68,py+5);
    py+=7;

    // Línea separadora inferior
    doc.setDrawColor(229,213,250);doc.setLineWidth(0.3);doc.line(xStart,py,xStart+width,py);

    // Roles
    if(rl.length){
      doc.setFillColor(240,233,255);doc.rect(xStart,py,width,3+rl.length*4.5,'F');
      doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(107,33,200);
      doc.text(rl,xStart+3,py+3);py+=3+rl.length*4.5;
    }

    // Total — botón redondeado pequeño proporcional al texto
    const totalTxt=getTotalLabel()+': '+fmtNum(o.valor)+' '+mon;
    const totalW=doc.getTextWidth(totalTxt)+6;
    doc.setFillColor(15,7,32);doc.roundedRect(xStart+width-totalW-2,py+2,totalW+2,6,2,2,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(224,200,255);
    doc.text(totalTxt,xStart+width-2,py+6.5,{align:'right'});

    // Solo avanzar Y después de propuestas impares (o la última)
    if(idx%2===0){
      if(!opts[idx+1]) y+=blockH+3; // única o última impar
    } else {
      y+=blockH+3;
    }
  });

  // Nueva página si hay más de 1 propuesta
  if(opts.length>1){doc.addPage();y=15;}

  // CONDICIÓN PARTICULAR
  if(v('cond_det')){
    secTitle('Condiciones particulares');
    doc.setFillColor(243,232,255);doc.setDrawColor(216,180,254);doc.setLineWidth(0.3);doc.roundedRect(M,y,U,10,1.5,1.5,'FD');
    doc.setDrawColor(139,47,201);doc.setLineWidth(1.5);doc.line(M,y,M,y+10);
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(76,29,149);doc.text(v('cond_det'),M+4,y+6.5);y+=14;
  }

  // CONDICIONES LEGALES
  secTitle('Condiciones legales');
  const legales=[

  legales.forEach(([n,t,d],i)=>{
    doc.setFillColor(i%2===0?248:255,i%2===0?245:255,255);doc.rect(M,y,U,10,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(107,33,200);doc.text(n,M+3,y+4.5);

  });

  // FIRMA
  if(y+25>285)doc.addPage();
  y+=6;
  doc.setDrawColor(216,180,254);doc.setLineWidth(0.4);doc.line(M,y,W-M,y);y+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(155,114,207);doc.text('Lemontech SpA  ·  Tax ID 99.511.620-0',M,y+3);

  doc.save((v('cl_razon')||'Cliente')+' - LemonFlow.pdf');
}
