<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LemonFlow — Generador de Propuestas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --negro:#0f0720;--morado:#6B21C8;--morado-vib:#8B2FC9;--morado-sub:#C77DFF; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:#0f0720;min-height:100vh;color:#1a0a2e;}
  .topbar{background:linear-gradient(90deg,#8B2FC9,#C13584);height:4px;}
  .navbar{background:#0f0720;padding:14px 32px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(139,47,201,0.3);justify-content:space-between;}
  .navbar-left{display:flex;align-items:center;gap:10px;}
  .logo-lemon{color:#C77DFF;font-size:20px;font-weight:600;}
  .logo-flow{color:#fff;font-size:20px;font-weight:600;}
  .logo-by{color:#9B72CF;font-size:11px;margin-left:2px;}
  .btn-repo{background:rgba(139,47,201,0.15);border:1px solid rgba(139,47,201,0.4);color:#C77DFF;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s;}
  .btn-repo:hover{background:rgba(139,47,201,0.3);}
  .main{display:grid;grid-template-columns:440px 1fr;min-height:calc(100vh - 56px);}
  .panel{background:#160a28;border-right:1px solid rgba(139,47,201,0.25);padding:28px 24px 40px;overflow-y:auto;}
  .panel-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#C77DFF;margin-bottom:20px;}
  .section-block{margin-bottom:22px;}
  .section-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8B2FC9;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid rgba(139,47,201,0.2);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .field-row.full{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:5px;}
  label{font-size:10.5px;color:#9B72CF;font-weight:500;letter-spacing:.03em;}
  input,select,textarea{background:rgba(255,255,255,0.04);border:1px solid rgba(139,47,201,0.3);border-radius:7px;padding:8px 11px;font-size:12.5px;font-family:'DM Sans',sans-serif;color:#e0c8ff;outline:none;transition:border-color .2s;width:100%;}
  textarea{resize:vertical;min-height:60px;}
  input:focus,select:focus,textarea:focus{border-color:#8B2FC9;background:rgba(139,47,201,0.08);}
  input::placeholder,textarea::placeholder{color:rgba(155,114,207,0.4);}
  select option{background:#1a0a2e;color:#e0c8ff;}
  .prod-row{display:grid;grid-template-columns:2fr 1.5fr 1.5fr;gap:8px;margin-bottom:8px;}
  .roles-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .toggle-lbl{font-size:11px;color:#9B72CF;font-weight:500;}
  .toggle{position:relative;width:36px;height:20px;cursor:pointer;}
  .toggle input{opacity:0;width:0;height:0;}
  .toggle-slider{position:absolute;inset:0;background:rgba(139,47,201,0.2);border-radius:20px;transition:.3s;border:1px solid rgba(139,47,201,0.3);}
  .toggle-slider:before{content:'';position:absolute;width:14px;height:14px;background:#9B72CF;border-radius:50%;left:2px;top:2px;transition:.3s;}
  .toggle input:checked+.toggle-slider{background:#6B21C8;}
  .toggle input:checked+.toggle-slider:before{transform:translateX(16px);background:#fff;}
  .second-prod{display:none;}
  .second-prod.visible{display:block;}
  .prod2-label{font-size:10px;color:#C77DFF;font-weight:600;margin-bottom:8px;padding:4px 8px;background:rgba(139,47,201,0.1);border-radius:5px;display:inline-block;}
  .btn-gen{width:100%;margin-top:24px;padding:13px;background:linear-gradient(135deg,#6B21C8,#8B2FC9);color:#fff;border:none;border-radius:10px;font-size:13.5px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;letter-spacing:.03em;transition:opacity .2s,transform .1s;}
  .btn-gen:hover{opacity:.9;}
  .btn-gen:active{transform:scale(.98);}
  .action-btns{display:flex;gap:8px;margin-top:10px;}
  .btn-save{flex:1;padding:10px;background:rgba(139,47,201,0.15);border:1px solid rgba(139,47,201,0.4);color:#C77DFF;border-radius:8px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .2s;}
  .btn-save:hover{background:rgba(139,47,201,0.3);}
  .preview-area{background:#f0eafa;display:flex;flex-direction:column;align-items:center;padding:32px 24px;overflow-y:auto;}
  .preview-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B21C8;margin-bottom:20px;align-self:flex-start;}
  .propuesta{background:#fff;width:100%;max-width:680px;border-radius:12px;overflow:hidden;box-shadow:0 8px 40px rgba(107,33,200,.15);}
  .prop-header{background:#0f0720;padding:0;}
  .prop-topbar{background:linear-gradient(90deg,#8B2FC9,#C13584);height:5px;}
  .prop-header-inner{padding:18px 22px 12px;display:flex;justify-content:space-between;align-items:flex-start;}
  .prop-logo-lemon{color:#C77DFF;font-size:20px;font-weight:700;}
  .prop-logo-flow{color:#fff;font-size:20px;font-weight:700;}
  .prop-logo-by{color:#9B72CF;font-size:10px;display:block;margin-top:1px;}
  .prop-header-right{text-align:right;font-size:10px;color:#9B72CF;line-height:1.9;}
  .prop-header-right .h{color:#e0c8ff;}
  .prop-header-right .l{color:#C77DFF;}
  .prop-subheader{background:#6B21C8;padding:7px 22px;display:flex;gap:0;}
  .prop-meta{flex:1;font-size:9.5px;color:#e0c8ff;}
  .prop-meta b{color:#C77DFF;}
  .prop-body{padding:18px 22px;}
  .prop-section{margin-bottom:16px;}
  .prop-sec-title{font-size:11px;font-weight:700;color:#6B21C8;border-left:3px solid #8B2FC9;padding-left:8px;margin-bottom:8px;}
  .prop-fields{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .prop-field{background:#F8F5FF;border:0.5px solid #e5d5fa;border-radius:6px;padding:6px 10px;}
  .prop-field .fl{font-size:8px;color:#9B72CF;margin-bottom:1px;}
  .prop-field .fv{font-size:11px;font-weight:600;color:#1a0a2e;}
  .prop-table{width:100%;border-collapse:collapse;font-size:10px;}
  .prop-table thead tr{background:#f3e8ff;}
  .prop-table thead th{text-align:left;padding:7px 9px;font-weight:700;color:#4c1d95;border-bottom:1px solid #d8b4fe;font-size:9.5px;}
  .prop-table tbody td{padding:7px 9px;color:#1a0a2e;border-bottom:0.5px solid #ede9f6;}
  .prop-table tbody tr:nth-child(2) td{background:#faf7ff;}
  .badge-gratis{background:#EAF3DE;color:#3B6D11;font-size:8.5px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;}
  .prop-total{display:flex;justify-content:flex-end;margin-top:7px;gap:6px;flex-wrap:wrap;}
  .prop-total-box{background:#0f0720;color:#e0c8ff;font-size:11px;font-weight:700;padding:7px 16px;border-radius:7px;}
  .prop-total-box.alt{background:#6B21C8;}
  .prop-desc{background:#F8F5FF;border:0.5px solid #e5d5fa;border-radius:6px;padding:8px 12px;font-size:10px;color:#4c1d95;margin-bottom:8px;line-height:1.6;}
  .prop-desc-lbl{font-size:8px;color:#9B72CF;font-weight:600;display:block;margin-bottom:3px;}
  .prop-cond{background:#f3e8ff;border-left:3px solid #8B2FC9;border:0.5px solid #d8b4fe;border-radius:6px;padding:9px 12px;font-size:10px;font-weight:700;color:#4c1d95;}
  .prop-legal-row{display:flex;gap:10px;padding:7px 10px;border-bottom:0.5px solid #ede9f6;font-size:9.5px;}
  .prop-legal-row:nth-child(odd){background:#F8F5FF;}
  .prop-legal-num{color:#6B21C8;font-weight:700;min-width:18px;}
  .prop-legal-ttl{font-weight:700;color:#1a0a2e;}
  .prop-legal-desc{color:#6b7280;margin-top:1px;}
  .prop-legal-desc a{color:#6B21C8;text-decoration:underline;font-size:9px;}
  .prop-footer{border-top:1px solid #ede9f6;padding:12px 22px;display:flex;justify-content:space-between;align-items:flex-end;}
  .prop-footer-left{font-size:9px;color:#9B72CF;}
  .prop-footer-right{text-align:center;font-size:9px;color:#6b7280;}
  .firma-line{border-top:1px solid #6b7280;width:140px;margin-bottom:4px;}
  .btn-dl{margin-top:16px;padding:11px 28px;background:#0f0720;color:#C77DFF;border:1px solid rgba(139,47,201,0.5);border-radius:8px;font-size:12.5px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;letter-spacing:.03em;transition:background .2s;}
  .btn-dl:hover{background:#1a0a2e;}
  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:#160a28;border:1px solid rgba(139,47,201,0.4);border-radius:14px;width:560px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;}
  .modal-header{padding:20px 24px 14px;border-bottom:1px solid rgba(139,47,201,0.2);display:flex;justify-content:space-between;align-items:center;}
  .modal-title{font-size:14px;font-weight:600;color:#C77DFF;}
  .modal-close{background:none;border:none;color:#9B72CF;font-size:20px;cursor:pointer;padding:0 4px;}
  .modal-body{padding:16px 24px;overflow-y:auto;flex:1;}
  .repo-empty{text-align:center;color:#9B72CF;font-size:13px;padding:32px 0;}
  .repo-item{background:rgba(139,47,201,0.08);border:1px solid rgba(139,47,201,0.2);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .repo-item-info{flex:1;min-width:0;}
  .repo-item-name{font-size:13px;font-weight:600;color:#e0c8ff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .repo-item-meta{font-size:10.5px;color:#9B72CF;}
  .repo-item-btns{display:flex;gap:6px;flex-shrink:0;}
  .btn-load{background:#6B21C8;border:none;color:#fff;padding:6px 14px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
  .btn-load:hover{background:#8B2FC9;}
  .btn-del{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:6px 10px;border-radius:6px;font-size:11.5px;cursor:pointer;font-family:'DM Sans',sans-serif;}
  .btn-del:hover{background:rgba(239,68,68,0.2);}
  .toast{position:fixed;bottom:24px;right:24px;background:#6B21C8;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;z-index:2000;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="topbar"></div>
<nav class="navbar">
  <div class="navbar-left">
    <span class="logo-lemon">Lemon</span><span class="logo-flow">Flow</span>
    <span class="logo-by">by LemonTech</span>
  </div>
  <button class="btn-repo" onclick="openRepo()">📁 Mis propuestas</button>
</nav>

<div class="main">
  <aside class="panel">
    <div class="panel-title">Generador de propuesta</div>

    <div class="section-block">
      <div class="section-label">Account Manager</div>
      <div class="field-row">
        <div class="field"><label>Nombre</label><input id="am_nombre" placeholder="Tu nombre" oninput="update()"></div>
        <div class="field"><label>Correo</label><input id="am_correo" placeholder="tu@lemontech.com" oninput="update()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Fecha de emisión</label><input id="am_emision" type="date" oninput="update()"></div>
        <div class="field"><label>Fecha de vencimiento</label><input id="am_vencimiento" type="date" oninput="update()"></div>
      </div>
    </div>

    <div class="section-block">
      <div class="section-label">Información del cliente</div>
      <div class="field-row">
        <div class="field"><label>Nombre de contacto</label><input id="cl_nombre" placeholder="Nombre del contacto" oninput="update()"></div>
        <div class="field"><label>Correo</label><input id="cl_correo" placeholder="correo@cliente.com" oninput="update()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Razón social</label><input id="cl_razon" placeholder="Nombre empresa" oninput="update()"></div>
        <div class="field"><label>Tax ID</label><input id="cl_tax" placeholder="ej. 76.123.456-7" oninput="update()"></div>
      </div>
      <div class="field-row full">
        <div class="field"><label>Dirección de facturación</label><input id="cl_dir" placeholder="Calle, ciudad, país" oninput="update()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Inicio suscripción</label><input id="cl_inicio" placeholder="ej. Mayo 2026" oninput="update()"></div>
        <div class="field"><label>Fin suscripción</label><input id="cl_fin" placeholder="ej. Abril 2027" oninput="update()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Modalidad de facturación</label>
          <select id="cl_modal" onchange="update()">
            <option value="Anual">Anual</option>
            <option value="Mensual">Mensual</option>
            <option value="Semestral">Semestral</option>
          </select>
        </div>
        <div class="field"><label>Contacto de pagos</label><input id="cl_pagos" placeholder="Nombre contacto" oninput="update()"></div>
      </div>
    </div>

    <div class="section-block">
      <div class="section-label">Producto</div>
      <div class="prod-row">
        <div class="field"><label>Producto / Add-on</label><input id="pr_prod" placeholder="ej. Lemonflow" oninput="update()"></div>
        <div class="field"><label>Valor mensual</label><input id="pr_valor" placeholder="0" oninput="update()"></div>
        <div class="field"><label>Implementación</label><input id="pr_impl" placeholder="ej. Gratis" oninput="update()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Vencimiento producto</label><input id="pr_venc" type="date" oninput="update()"></div>
        <div class="field"><label>Moneda</label>
          <select id="pr_moneda" onchange="update()">
            <option value="USD">USD</option><option value="CLP">CLP</option>
            <option value="UF">UF</option><option value="EUR">EUR</option>
            <option value="MXN">MXN</option><option value="COP">COP</option>
            <option value="PEN">PEN</option>
          </select>
        </div>
      </div>

      <!-- Usuarios por rol -->
      <div class="section-label" style="margin-top:12px;">Usuarios por rol</div>
      <div class="roles-grid">
        <div class="field"><label>Super Administrador</label><input id="rol_superadmin" type="number" min="0" placeholder="0" oninput="update()"></div>
        <div class="field"><label>Administrador</label><input id="rol_admin" type="number" min="0" placeholder="0" oninput="update()"></div>
        <div class="field"><label>Contribuyente</label><input id="rol_contrib" type="number" min="0" placeholder="0" oninput="update()"></div>
        <div class="field"><label>DPO</label><input id="rol_dpo" type="number" min="0" placeholder="0" oninput="update()"></div>
        <div class="field"><label>Razones sociales</label><input id="rol_razon" type="number" min="0" placeholder="0" oninput="update()"></div>
      </div>

      <div class="toggle-row" style="margin-top:14px;">
        <label class="toggle"><input type="checkbox" id="toggle2" onchange="toggleSecond()"><span class="toggle-slider"></span></label>
        <span class="toggle-lbl">Agregar segunda cotización (opcional)</span>
      </div>
      <div class="second-prod" id="second-prod">
        <div class="prod2-label">✦ Opción 2</div>
        <div class="prod-row">
          <div class="field"><label>Producto / Add-on</label><input id="pr2_prod" placeholder="ej. Lemonflow" oninput="update()"></div>
          <div class="field"><label>Valor mensual</label><input id="pr2_valor" placeholder="0" oninput="update()"></div>
          <div class="field"><label>Implementación</label><input id="pr2_impl" placeholder="ej. Gratis" oninput="update()"></div>
        </div>
        <div class="section-label" style="margin-top:8px;">Usuarios por rol — Opción 2</div>
        <div class="roles-grid">
          <div class="field"><label>Super Administrador</label><input id="rol2_superadmin" type="number" min="0" placeholder="0" oninput="update()"></div>
          <div class="field"><label>Administrador</label><input id="rol2_admin" type="number" min="0" placeholder="0" oninput="update()"></div>
          <div class="field"><label>Contribuyente</label><input id="rol2_contrib" type="number" min="0" placeholder="0" oninput="update()"></div>
          <div class="field"><label>DPO</label><input id="rol2_dpo" type="number" min="0" placeholder="0" oninput="update()"></div>
          <div class="field"><label>Razones sociales</label><input id="rol2_razon" type="number" min="0" placeholder="0" oninput="update()"></div>
        </div>
      </div>
    </div>

    <div class="section-block">
      <div class="section-label">Condición particular</div>
      <div class="field-row full">
        <div class="field"><label>Detalle</label><input id="cond_det" placeholder="Describe la condición especial" oninput="update()"></div>
      </div>
    </div>

    <button class="btn-gen" onclick="update()">↻ Actualizar vista previa</button>
    <div class="action-btns">
      <button class="btn-save" onclick="saveProposal()">💾 Guardar propuesta</button>
    </div>
  </aside>

  <section class="preview-area">
    <div class="preview-title">Vista previa de la propuesta</div>
    <div class="propuesta" id="propuesta"></div>
    <button class="btn-dl" onclick="downloadPDF()">⬇ Descargar PDF</button>
  </section>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-repo" onclick="if(event.target===this)closeRepo()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">📁 Mis propuestas guardadas</span>
      <button class="modal-close" onclick="closeRepo()">✕</button>
    </div>
    <div class="modal-body" id="repo-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function v(id){return(document.getElementById(id)||{}).value||'';}
function fmtDate(str){if(!str)return'';const d=new Date(str+'T00:00:00');if(isNaN(d))return str;return d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});}
function calcTotal(val){return((parseFloat(val)||0)*12).toLocaleString('es-CL');}

function toggleSecond(){
  const on=document.getElementById('toggle2').checked;
  document.getElementById('second-prod').classList.toggle('visible',on);
  update();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

function update(){
  const mon=v('pr_moneda');
  const total=calcTotal(v('pr_valor'));
  const show2=document.getElementById('toggle2').checked;
  const total2=calcTotal(v('pr2_valor'));

  // Roles opción 1
  const roles1=[
    ['Super Administrador', v('rol_superadmin')],
    ['Administrador', v('rol_admin')],
    ['Contribuyente', v('rol_contrib')],
    ['DPO', v('rol_dpo')],
    ['Razones sociales', v('rol_razon')],
  ].filter(r=>r[1]&&r[1]!=='0');

  const roles2=[
    ['Super Administrador', v('rol2_superadmin')],
    ['Administrador', v('rol2_admin')],
    ['Contribuyente', v('rol2_contrib')],
    ['DPO', v('rol2_dpo')],
    ['Razones sociales', v('rol2_razon')],
  ].filter(r=>r[1]&&r[1]!=='0');

  const rolesHtml=function(roles,label){
    if(!roles.length) return '';
    var rows=roles.map(function(r,i){
      return '<tr style="background:'+(i%2===0?'#fff':'#faf7ff')+'"><td style="padding:4px 8px;">'+r[0]+'</td><td style="padding:4px 8px;text-align:center;font-weight:600;">'+r[1]+'</td></tr>';
    }).join('');
    return '<div class="prop-desc"><span class="prop-desc-lbl">'+label+'</span><table style="width:100%;font-size:10px;border-collapse:collapse;"><thead><tr style="background:#f3e8ff;"><th style="text-align:left;padding:4px 8px;color:#4c1d95;font-size:9px;">Rol</th><th style="text-align:center;padding:4px 8px;color:#4c1d95;font-size:9px;">Cantidad</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  };

  const prod2Row=show2?('<tr style="background:#faf7ff;"><td>'+(v('pr2_prod')||'—')+'</td><td>'+(v('pr2_valor')||'0')+' '+mon+'</td><td><span class="badge-gratis">'+(v('pr2_impl')||'—')+'</span></td><td>—</td></tr>'):'';

  var totalBoxes='<div class="prop-total-box">'+(show2?'Opción 1 — ':'')+'Total anual: '+total+' '+mon+'</div>';
  if(show2) totalBoxes+='<div class="prop-total-box alt">Opción 2 — Total anual: '+total2+' '+mon+'</div>';

  document.getElementById('propuesta').innerHTML=`
  <div class="prop-header">
    <div class="prop-topbar"></div>
    <div class="prop-header-inner">
      <div><div><span class="prop-logo-lemon">Lemon</span><span class="prop-logo-flow">Flow</span></div><span class="prop-logo-by">by LemonTech</span></div>
      <div class="prop-header-right"><div class="h">Lemontech SpA · Tax ID 99.511.620-0</div><div>Las Condes, Santiago. Chile.</div><div class="l">www.lemontech.com</div></div>
    </div>
    <div class="prop-subheader">

// ── REPOSITORIO ──────────────────────────────────────────────────────────────
const SHEETS_URL='https://script.google.com/a/macros/lemontech.com/s/AKfycbyHOYany7ng5eYhjqMXQVQAhWy-J2nejUWafdbl0iZJa60ii4JtOXYFB3ua1_i8PSeKXA/exec';
const STORAGE_KEY='lemonflow_proposals';

function getProposals(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}catch(e){return[];}}
function saveProposalsLocal(arr){localStorage.setItem(STORAGE_KEY,JSON.stringify(arr));}

function collectData(){
  const ids=['am_nombre','am_correo','am_emision','am_vencimiento',
    'cl_nombre','cl_correo','cl_razon','cl_tax','cl_dir','cl_inicio','cl_fin','cl_modal','cl_pagos',
    'pr_prod','pr_valor','pr_impl','pr_venc','pr_moneda',
    'rol_superadmin','rol_admin','rol_contrib','rol_dpo','rol_razon',
    'pr2_prod','pr2_valor','pr2_impl',
    'rol2_superadmin','rol2_admin','rol2_contrib','rol2_dpo','rol2_razon',
    'cond_det'];
  const data={};
  ids.forEach(id=>data[id]=v(id));
  data._show2=document.getElementById('toggle2').checked;
  return data;
}

function loadData(data){
  Object.entries(data).forEach(([id,val])=>{
    const el=document.getElementById(id);
    if(el&&id!=='_show2')el.value=val;
  });
  document.getElementById('toggle2').checked=!!data._show2;
  document.getElementById('second-prod').classList.toggle('visible',!!data._show2);
  update();
}

async function saveProposal(){
  const cliente=v('cl_razon')||v('cl_nombre');
  const am=v('am_nombre');
  if(!cliente){showToast('⚠ Ingresa al menos el nombre del cliente');return;}
  if(!am){showToast('⚠ Ingresa tu nombre como Account Manager');return;}

  const data=collectData();
  const nombre_propuesta=`${cliente} - LemonFlow`;
  data.nombre_propuesta=nombre_propuesta;

  // Guardar local
  const proposals=getProposals();
  const id=Date.now();
  const date=new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
  proposals.unshift({id,name:nombre_propuesta,date,data});
  saveProposalsLocal(proposals);

  // Guardar en Google Sheets
  showToast('💾 Guardando en la nube...');
  try{
    await fetch(SHEETS_URL,{method:'POST',body:JSON.stringify(data)});
    showToast(`✓ "${nombre_propuesta}" guardada en la nube`);
  }catch(e){
    showToast(`✓ Guardada localmente (sin conexión a la nube)`);
  }
}

function openRepo(){renderRepo();document.getElementById('modal-repo').classList.add('open');}
function closeRepo(){document.getElementById('modal-repo').classList.remove('open');}

async function renderRepo(){
  const list=document.getElementById('repo-list');
  const am=v('am_nombre');
  list.innerHTML='<div class="repo-empty">Cargando propuestas...</div>';

  // Intentar cargar desde Google Sheets
  if(am){
    try{
      const res=await fetch(`${SHEETS_URL}?am=${encodeURIComponent(am)}`);
      const json=await res.json();
      if(json.proposals&&json.proposals.length){
        list.innerHTML=json.proposals.map((p,i)=>`
          <div class="repo-item">
            <div class="repo-item-info">
              <div class="repo-item-name">${p.nombre}</div>
              <div class="repo-item-meta">☁️ Guardado el ${p.fecha}</div>
            </div>
            <div class="repo-item-btns">
              <button class="btn-load" onclick='loadCloudProposal(${JSON.stringify(p.data).replace(/'/g,"&#39;")})'>Abrir</button>
            </div>
          </div>`).join('');
        return;
      }
    }catch(e){}
  }

  // Fallback a local
  const proposals=getProposals();
  if(!proposals.length){
    list.innerHTML=`<div class="repo-empty">${am?'No hay propuestas guardadas para <b>'+am+'</b>.':'Ingresa tu nombre de AM para ver tus propuestas.'}<br>Completa el formulario y haz clic en <b>Guardar propuesta</b>.</div>`;
    return;
  }
  list.innerHTML=proposals.map(p=>`
    <div class="repo-item">
      <div class="repo-item-info">
        <div class="repo-item-name">${p.name}</div>
        <div class="repo-item-meta">📱 Local — ${p.date}</div>
      </div>
      <div class="repo-item-btns">
        <button class="btn-load" onclick="loadProposal(${p.id})">Abrir</button>
        <button class="btn-del" onclick="deleteProposal(${p.id})">✕</button>
      </div>
    </div>`).join('');
}

function loadCloudProposal(data){loadData(data);closeRepo();showToast(`✓ Propuesta cargada desde la nube`);}

function loadProposal(id){
  const p=getProposals().find(x=>x.id===id);
  if(p){loadData(p.data);closeRepo();showToast(`✓ Propuesta de ${p.name} cargada`);}
}

function deleteProposal(id){
  saveProposalsLocal(getProposals().filter(x=>x.id!==id));
  renderRepo();
}

  doc.setFontSize(8);doc.setTextColor(155,114,207);doc.text('by LemonTech',M,20);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(224,200,255);
  doc.text('Lemontech SpA  ·  Tax ID 99.511.620-0',W-M,12,{align:'right'});
  doc.text('Las Condes, Santiago. Chile.',W-M,18,{align:'right'});
  doc.setTextColor(199,125,255);doc.text('www.lemontech.com',W-M,24,{align:'right'});

  doc.setFillColor(107,33,200);doc.rect(0,28,W,9,'F');
  const metas=[['Account Manager',v('am_nombre')],['Correo',v('am_correo')],['Emisión',fmtDate(v('am_emision'))],['Vence',fmtDate(v('am_vencimiento'))]];
  const colW=U/4;
  metas.forEach(([lbl,val],i)=>{
    const x=M+i*colW;
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(199,125,255);doc.text(lbl,x,33.5);
    doc.setFont('helvetica','normal');doc.setTextColor(224,200,255);doc.text(val||'',x,37.5);
  });

  let y=44;
  const secTitle=(txt)=>{doc.setDrawColor(139,47,201);doc.setLineWidth(0.8);doc.line(M,y,M,y+5);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(107,33,200);doc.text(txt,M+4,y+4);y+=9;};
  const fieldGrid=(pairs)=>{
    const hw=(U-3)/2;
    for(let i=0;i<pairs.length;i+=2){
      pairs.slice(i,i+2).forEach((p,j)=>{
        const x=M+j*(hw+3);
        doc.setFillColor(248,245,255);doc.setDrawColor(229,213,250);doc.setLineWidth(0.3);doc.roundedRect(x,y,hw,10,1.5,1.5,'FD');
        doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(155,114,207);doc.text(p[0],x+3,y+4);
        doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(26,10,46);doc.text(p[1]||'—',x+3,y+8.5);
      });
      y+=12;
    }
    y+=2;
  };

  secTitle('Información del cliente');
  fieldGrid([['Nombre de contacto',v('cl_nombre')],['Correo',v('cl_correo')],['Razón social',v('cl_razon')],['Tax ID',v('cl_tax')],['Dirección de facturación',v('cl_dir')],['Modalidad de facturación',v('cl_modal')],['Inicio suscripción',v('cl_inicio')],['Fin suscripción',v('cl_fin')]]);

  secTitle(show2?'Productos — Doble cotización':'Productos');

  // Descripciones
  const addDescBox=(lbl,txt)=>{
    if(!txt)return;
    const lines=doc.splitTextToSize(txt,U-10);
    const h=Math.max(10,6+lines.length*4.5);
    doc.setFillColor(248,245,255);doc.setDrawColor(229,213,250);doc.setLineWidth(0.3);doc.rect(M,y,U,h,'FD');
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(155,114,207);doc.text(lbl,M+3,y+4);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(76,29,149);doc.text(lines,M+3,y+8.5);
    y+=h+2;
  };
  addDescBox(show2?'DESCRIPCIÓN OPCIÓN 1':'DESCRIPCIÓN',v('pr_desc'));
  if(show2)addDescBox('DESCRIPCIÓN OPCIÓN 2',v('pr2_desc'));

  const cols=[30,50,30,30,30];
  const heads=['Cantidad','Producto','Valor mensual','Implementación','Vencimiento'];
  doc.setFillColor(243,232,255);doc.setDrawColor(216,180,254);doc.setLineWidth(0.3);doc.rect(M,y,U,8,'FD');
  let cx=M;
  heads.forEach((h,i)=>{doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(76,29,149);doc.text(h,cx+2,y+5.5);cx+=cols[i];});
  y+=8;
  const vals=[v('pr_cant'),v('pr_prod'),`${v('pr_valor')} ${mon}`,v('pr_impl'),fmtDate(v('pr_venc'))];
  doc.setFillColor(255,255,255);doc.rect(M,y,U,8,'FD');cx=M;
  vals.forEach((val,i)=>{doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(26,10,46);doc.text(val||'—',cx+2,y+5.5);cx+=cols[i];});
  y+=8;
  if(show2){
    const vals2=[v('pr2_cant'),v('pr2_prod'),`${v('pr2_valor')} ${mon}`,v('pr2_impl'),'—'];
    doc.setFillColor(250,247,255);doc.rect(M,y,U,8,'FD');cx=M;
    vals2.forEach((val,i)=>{doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(26,10,46);doc.text(val||'—',cx+2,y+5.5);cx+=cols[i];});
    y+=8;
  }
  y+=2;
  doc.setFillColor(15,7,32);doc.roundedRect(W-M-72,y,72,8,2,2,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(224,200,255);
  doc.text(`${show2?'Opción 1 — ':''}Total anual: ${total} ${mon}`,W-M-3,y+5.5,{align:'right'});
  y+=10;
  if(show2){
    doc.setFillColor(107,33,200);doc.roundedRect(W-M-72,y,72,8,2,2,'F');
    doc.setTextColor(255,255,255);doc.text(`Opción 2 — Total anual: ${total2} ${mon}`,W-M-3,y+5.5,{align:'right'});
    y+=10;
  }
  y+=4;

  secTitle('Condiciones particulares');
  doc.setFillColor(243,232,255);doc.setDrawColor(216,180,254);doc.setLineWidth(0.3);doc.rect(M,y,U,10,'FD');
  doc.setDrawColor(139,47,201);doc.setLineWidth(1.5);doc.line(M,y,M,y+10);
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(76,29,149);doc.text(v('cond_det')||'—',M+4,y+6.5);y+=15;

  secTitle('Condiciones legales');
  const legales=[['1.','Aceptación de la propuesta','La suscripción mediante firma implica la aceptación del servicio.'],['2.','Términos y condiciones','recursos.lemontech.com/hubfs/Archivos-legales/ACUERDO-MARCO-DE-SERVICIOS-DE-LEMONTECH.pdf'],['3.','Aviso de privacidad','recursos.lemontech.com/hubfs/Archivos-legales/AVISO-DE-PRIVACIDAD-LEMONTECH-Clientes.pdf']];
  legales.forEach(([n,t,d],i)=>{
    doc.setFillColor(i%2===0?248:255,i%2===0?245:255,255);doc.rect(M,y,U,10,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(107,33,200);doc.text(n,M+3,y+4.5);
    doc.setTextColor(26,10,46);doc.text(t,M+11,y+4.5);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(107,114,128);doc.text(d,M+11,y+8.5);
    y+=11;
  });
  y+=6;doc.setDrawColor(216,180,254);doc.setLineWidth(0.4);doc.line(M,y,W-M,y);y+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(155,114,207);doc.text('Lemontech SpA  ·  Tax ID 99.511.620-0',M,y+3);
  doc.setTextColor(107,114,128);doc.line(W-M-45,y+6,W-M,y+6);doc.text('Firma cliente',W-M-22,y+10,{align:'center'});
